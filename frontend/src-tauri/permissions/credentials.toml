[[permission]]
identifier = "credentials"
description = "Allows the main window to store or delete opaque SSH and model API credential references."
commands.allow = [
  "store_ssh_password",
  "store_private_key_passphrase",
  "import_private_key",
  "delete_ssh_credential",
  "store_model_api_key",
  "delete_model_api_key",
]
