[package]
name = "harness-shell"
version = "0.2.0"
description = "Windows desktop client for Harness Shell"
authors = []
edition = "2021"

# 更多键及其定义参见 https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# `_lib` 后缀用于保持库名称唯一，
# 避免与二进制名称冲突。
# 此问题似乎仅出现在 Windows，参见 https://github.com/rust-lang/cargo/issues/8519
name = "harness_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2.9.0"
url = "2"
windows-sys = { version = "0.61", features = [
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
toml = "0.9"
