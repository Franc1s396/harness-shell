name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  frontend:
    name: Frontend
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm.cmd --prefix frontend ci

      - name: Run tests
        run: npm.cmd --prefix frontend run test

      - name: Type check and build
        run: npm.cmd --prefix frontend run build

  backend:
    name: Backend
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # uv provides Windows builds for Python 3.12 security releases.
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.17"
          enable-cache: false

      - name: Install Python
        run: uv python install cpython-3.12-windows-x86_64-none

      - name: Create virtual environment
        run: |
          uv venv --managed-python `
            --python cpython-3.12-windows-x86_64-none `
            --seed backend/.venv

      - name: Verify Python version
        run: |
          backend\.venv\Scripts\python.exe -c "import sys, struct; print(sys.version); assert sys.version_info[:2] == (3, 12); assert sys.version_info.releaselevel == 'final'; assert struct.calcsize('P') == 8"

      - name: Install dependencies
        run: |
          backend\.venv\Scripts\python.exe -m pip install `
            -c backend/build-requirements.lock `
            -e "./backend[dev]"

      - name: Prepare tokenizer
        run: |
          backend\.venv\Scripts\python.exe `
            backend/scripts/prepare_tokenizer.py `
            --output-dir backend/build/tokenizer

      - name: Check HTTP contracts
        run: |
          backend\.venv\Scripts\python.exe `
            backend/scripts/export_http_contract.py --check

      - name: Run tests
        run: backend\.venv\Scripts\python.exe -m pytest backend -q
