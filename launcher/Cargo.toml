[package]
name = "harness-shell-launcher"
version = "0.1.0"
edition = "2021"

[lib]
name = "harness_shell_launcher"
path = "src/lib.rs"

[[bin]]
name = "harness-shell-launcher"
path = "src/main.rs"

[[bin]]
name = "launcher_test_child"
path = "src/bin/launcher_test_child.rs"

[build-dependencies]
tauri-winres = "0.3.6"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
