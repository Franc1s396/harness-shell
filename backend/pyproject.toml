[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-shell-sidecar"
version = "0.2.2"
description = "Python sidecar for Harness Shell"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "SQLAlchemy>=2.0.37,<2.1",
  "alembic>=1.14,<2",
  "asyncssh>=2.24,<2.25",
  "bcrypt>=4,<6",
  "cryptography>=48.0.1,<51",
  "fastapi>=0.115,<1",
  "httpx==0.28.1",
  "langchain-core==1.6.0",
  "openai==3.6.0",
  "tiktoken==0.12.0",
  "langgraph==1.2.11",
  "pydantic>=2.11,<3",
  "uvicorn>=0.34,<1",
  "websockets>=16,<17",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.14,<7", "pytest>=8.3,<10"]

[project.scripts]
harness-shell-sidecar = "harness_shell_sidecar.__main__:main"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"harness_shell_sidecar.storage" = ["alembic/env.py", "alembic/script.py.mako", "alembic/versions/*.py"]
