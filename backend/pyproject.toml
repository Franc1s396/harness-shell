[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-shell-sidecar"
version = "0.1.0"
description = "Python sidecar for Harness Shell"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=45,<48",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[project.scripts]
harness-shell-sidecar = "harness_shell_sidecar.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"harness_shell_sidecar.storage" = ["migrations/*.sql"]
